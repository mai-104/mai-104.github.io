<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#232a78">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>まぃの箱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --sky-top:#1c2470; --sky-mid:#4a3fae; --sky-low:#b9a3f2;
  --card:rgba(255,255,255,.92); --ink:#3b2f73; --ink-soft:#7a6aa8;
  --gold:#f3c25a; --line:rgba(255,255,255,.35);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%) fixed;
  padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 32px);
  -webkit-tap-highlight-color:transparent;
}
.stars{position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent),radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent),
  radial-gradient(1.5px 1.5px at 62% 30%,#fff8d8 50%,transparent),radial-gradient(1px 1px at 30% 40%,#fff 50%,transparent),
  radial-gradient(1.5px 1.5px at 88% 46%,#fff 50%,transparent),radial-gradient(1px 1px at 8% 60%,#fff8d8 50%,transparent);
  opacity:.8}
main{position:relative;max-width:460px;margin:0 auto}
header{text-align:center;margin-bottom:24px;color:#fff}
header img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 24px rgba(10,10,60,.35)}
h1{font-size:30px;font-weight:900;letter-spacing:.04em;margin-top:12px}
.lead{font-size:14px;font-weight:500;opacity:.85;margin-top:4px}
.list{display:flex;flex-direction:column;gap:14px}
.game{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;
  background:var(--card);text-decoration:none;color:inherit;
  box-shadow:0 6px 18px rgba(20,16,80,.22);transition:transform .12s}
.game:active{transform:scale(.97)}
.game img{width:64px;height:64px;border-radius:16px;flex:none;background:#eee}
.game .t{font-size:17px;font-weight:700;line-height:1.35}
.game .d{font-size:13px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.game .go{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;
  background:var(--gold);color:#6b4a00;display:grid;place-items:center;font-weight:900}
.soon{display:flex;align-items:center;justify-content:center;padding:18px;border-radius:20px;
  border:2px dashed var(--line);color:#fff;font-size:14px;font-weight:500;opacity:.8}
footer{text-align:center;color:#fff;opacity:.7;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <header>
    <img src="/icon-192.png" alt="">
    <h1>まぃの箱</h1>
    <p class="lead">あそびたいゲームをえらんでね</p>
  </header>
  <nav class="list" id="list" aria-label="ゲーム一覧"></nav>
  <footer>ゲームから戻るときは、スマホの「戻る」で戻れるよ</footer>
</main>
<script>
/* ===== ゲームを増やすときは、ここに1行足すだけ =====
   folder: GitHubのリポジトリ名 / name: 表示名 / desc: 一言説明 */
var GAMES = [
  { folder: "omikuji-gacha",   name: "おみくじガチャ",     desc: "今日の運勢を占おう" },
  { folder: "himitsu-no-tane", name: "秘密の種と宝探し",   desc: "お花畑と宝島のパズル" },
  { folder: "hare-sweets", name: "晴れときどきスイーツ", desc: "ブロック着せ替え落ちものパズル" }  
];
var SHOW_SOON = true; /* 「次のゲーム 準備中」の枠を出すなら true */

var list = document.getElementById("list");
GAMES.forEach(function (g) {
  var a = document.createElement("a");
  a.className = "game";
  a.href = "/" + g.folder + "/";
  a.innerHTML = '<img src="/' + g.folder + '/icon-192.png" alt="" loading="lazy">' +
    '<div><div class="t"></div><div class="d"></div></div><span class="go" aria-hidden="true">›</span>';
  a.querySelector(".t").textContent = g.name;
  a.querySelector(".d").textContent = g.desc;
  list.appendChild(a);
});
if (SHOW_SOON) {
  var s = document.createElement("div");
  s.className = "soon";
  s.textContent = "次のゲーム、準備中…";
  list.appendChild(s);
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
}
</script>
</body>
</html>
